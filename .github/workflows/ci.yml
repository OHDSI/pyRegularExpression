# GitHub Actions workflow for Python package with Poetry, Docker, and comprehensive testing.
# This workflow is designed to be secure, efficient, and provide detailed logs.

name: Python CI

# 1. Core Workflow Requirements: Triggers and Concurrency
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 2. Security: Principle of Least Privilege (PoLP)
permissions:
  contents: read

jobs:
  test:
    name: Test - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    # 3. Matrix Testing Strategy
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-2025]

    steps:
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      # 4. Poetry Integration, Caching, and Debugging
      - name: Install Poetry
        run: |
          python -m pip install pipx
          pipx install poetry

      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'

      - name: Dump environment details for debugging
        run: |
          echo "OS/Runner: ${{ runner.os }}"
          echo "Python version:"
          python --version
          echo "Poetry version:"
          poetry --version
          echo "Poetry Environment Info:"
          poetry env info
          echo "PATH:"
          echo $PATH
        shell: bash

      - name: Install dependencies
        run: poetry install --no-interaction --with dev -vv

      - name: Verify Dependency Tree
        run: poetry show --tree

      # 5. Comprehensive Testing and Code Coverage
      # NOTE: This step currently runs all tests found in the 'tests/' directory.
      # For a true unit/integration split, modify the path or use pytest markers.
      - name: Run All Tests (as Unit Tests)
        run: poetry run pytest -vv tests/ --cov=./ --cov-report=xml:coverage-unit.xml

      # --- Placeholder for Integration Tests ---
      # This step is a placeholder for future integration tests.
      # To enable it:
      # 1. Create your integration tests in a separate directory (e.g., 'tests/integration/').
      # 2. If needed, add service containers (e.g., for a database) to this job using the 'services' key.
      # 3. Uncomment the following steps.
      # - name: Run Integration Tests
      #   run: poetry run pytest -vv tests/integration/ --cov=./ --cov-report=xml:coverage-integration.xml

      - name: Upload Unit Test coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage-unit.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}-unit
          fail_ci_if_error: true
          verbose: true

      # - name: Upload Integration Test coverage to Codecov
      #   if: ${{ !cancelled() }}
      #   uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     file: ./coverage-integration.xml
      #     flags: ${{ matrix.os }}-py${{ matrix.python-version }}-integration
      #     fail_ci_if_error: true
      #     verbose: true

      # 6. Failure Handling and Artifacts
      - name: Upload reports and logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-failure-reports-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            coverage-unit.xml
            coverage-integration.xml
          if-no-files-found: ignore